<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
<title>WhisperBar — Configurazione ambiente</title>
<style>
  html, body { height: 100%; background: var(--bg-pill); }
  #app { display: flex; flex-direction: column; height: 100%; }

  #titlebar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding-left: 16px;
    background: var(--bg-surface-2);
    border-bottom: 1px solid var(--border-soft);
    -webkit-app-region: drag;
    gap: 10px;
  }
  #titlebar .dot { width: 16px; height: 16px; border-radius: 5px; background: var(--accent); }
  #titlebar .name { font-size: 12.5px; font-weight: 500; color: var(--text-primary); flex: 1; }

  #status-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 22px 6px;
  }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--accent-soft); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; flex-shrink: 0;
  }
  .status-icon {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
  }
  .status-icon.ok { background: var(--accent); }
  .status-icon.fail { background: var(--danger); }
  #status-text { font-size: 13.5px; color: var(--text-primary); }
  #status-sub { font-size: 11.5px; color: var(--text-secondary); padding: 0 22px 14px; }

  #log {
    flex: 1;
    margin: 0 22px 16px;
    padding: 14px 16px;
    border-radius: 10px;
    background: var(--bg-surface-3);
    box-shadow: 0 0 0 1px var(--border-soft);
    overflow-y: auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--text-secondary-2);
    white-space: pre-wrap;
  }

  #footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 0 22px 20px;
  }
  .btn {
    padding: 0 16px; height: 32px; border-radius: 9px; font-size: 12.5px;
    border: none; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); font-weight: 600; }
  .btn-ghost { background: var(--control-bg); color: var(--text-primary); font-weight: 500; }
  .btn[disabled] { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div class="dot"></div>
      <div class="name">WhisperBar — Configurazione ambiente</div>
    </div>

    <div id="status-row">
      <div class="spinner" id="status-spinner"></div>
      <div id="status-text">Installazione in corso…</div>
    </div>
    <div id="status-sub">Scarico e configuro faster-whisper. Puo' richiedere qualche minuto.</div>

    <div id="log"></div>

    <div id="footer">
      <button class="btn btn-ghost" id="btn-close" disabled>Chiudi</button>
    </div>
  </div>

  <script src="setup.js"></script>
</body>
</html>
