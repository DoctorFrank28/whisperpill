<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
<title>WhisperPill — Configurazione ambiente</title>
<style>
  html, body { height: 100%; background: var(--bg-pill); }
  #app { display: flex; flex-direction: column; height: 100%; }

  #titlebar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding-left: 16px;
    background: var(--bg-surface-2);
    border-bottom: 1px solid var(--border-soft);
    -webkit-app-region: drag;
    gap: 10px;
  }
  #titlebar .dot { width: 16px; height: 16px; border-radius: 5px; background: var(--accent); }
  #titlebar .name { font-size: 12.5px; font-weight: 500; color: var(--text-primary); flex: 1; }

  .phase { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .phase.active { display: flex; }

  /* ---- fase: installazione ambiente ---- */
  #status-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 22px 6px;
  }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--accent-soft); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; flex-shrink: 0;
  }
  .status-icon {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
  }
  .status-icon.ok { background: var(--accent); }
  .status-icon.fail { background: var(--danger); }
  #status-text { font-size: 13.5px; color: var(--text-primary); }
  #status-sub { font-size: 11.5px; color: var(--text-secondary); padding: 0 22px 14px; }

  #log {
    flex: 1;
    margin: 0 22px 16px;
    padding: 14px 16px;
    border-radius: 10px;
    background: var(--bg-surface-3);
    box-shadow: 0 0 0 1px var(--border-soft);
    overflow-y: auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--text-secondary-2);
    white-space: pre-wrap;
  }

  /* ---- fase: scelta modelli ---- */
  #models-header { padding: 18px 22px 4px; }
  #models-title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
  #models-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 4px; }

  #models-list {
    flex: 1;
    overflow-y: auto;
    margin: 12px 22px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .model-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 13px;
    border-radius: 10px;
    background: var(--bg-surface-2);
    box-shadow: 0 0 0 1px var(--border-softer);
  }
  .model-row input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0;
  }
  .model-info { flex: 1; min-width: 0; }
  .model-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .model-desc { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .model-size { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
  .model-status { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; flex-shrink: 0; min-width: 70px; text-align: right; }
  .model-status.ok { color: var(--accent); }
  .model-status.fail { color: var(--danger); }
  .model-progress {
    width: 60px; height: 4px; border-radius: 2px; background: var(--border-softer);
    overflow: hidden; flex-shrink: 0;
  }
  .model-progress > div { height: 100%; background: var(--accent); width: 0%; }

  #footer, #models-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 16px 22px 20px;
  }
  .btn {
    padding: 0 16px; height: 32px; border-radius: 9px; font-size: 12.5px;
    border: none; cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--accent-contrast); font-weight: 600; }
  .btn-ghost { background: var(--control-bg); color: var(--text-primary); font-weight: 500; }
  .btn[disabled] { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div class="dot"></div>
      <div class="name" id="titlebar-name" data-i18n="setup.envTitle">WhisperPill — Configurazione ambiente</div>
    </div>

    <div class="phase active" id="phase-install">
      <div id="status-row">
        <div class="spinner" id="status-spinner"></div>
        <div id="status-text" data-i18n="setup.installing">Installazione in corso…</div>
      </div>
      <div id="status-sub" data-i18n="setup.installingDesc">Scarico e configuro faster-whisper. Puo' richiedere qualche minuto.</div>

      <div id="log"></div>

      <div id="footer">
        <button class="btn btn-ghost" id="btn-close" disabled data-i18n="setup.close">Chiudi</button>
      </div>
    </div>

    <div class="phase" id="phase-models">
      <div id="models-header">
        <div id="models-title" data-i18n="setup.modelsTitle">Quali modelli vuoi scaricare?</div>
        <div id="models-sub" data-i18n="setup.modelsSub">Puoi cambiarli in qualsiasi momento dalle Impostazioni &rsaquo; Modelli. "small" e' un buon compromesso per iniziare.</div>
      </div>
      <div id="models-list"></div>
      <div id="models-footer">
        <button class="btn btn-ghost" id="btn-skip" data-i18n="setup.skip">Salta per ora</button>
        <button class="btn btn-primary" id="btn-download" data-i18n="setup.download">Scarica selezionati</button>
      </div>
    </div>
  </div>

  <script src="i18n-client.js"></script>
  <script src="setup.js"></script>
</body>
</html>
